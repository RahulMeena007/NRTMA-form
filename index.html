<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRTMA Adventure Application Form</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Cursive font for handwriting effect -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
    <!-- UI font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <div class="header-content">
                <img src="https://upload.wikimedia.org/wikipedia/en/thumb/4/45/Indian_Railway_Logo_2.svg/1200px-Indian_Railway_Logo_2.svg.png" alt="Logo" class="logo">
                <h1>NRTMA Application Portal</h1>
                <p>Fill out the form digitally and generate a printable copy instantly.</p>
            </div>
        </header>

        <main>
            <div class="split-layout">
                <!-- Form Section -->
                <div class="panel form-panel glass">
                    <h2>Fill Application Details</h2>
                    <form id="nrtma-form">
                        <div class="form-section">
                            <h3>General Details</h3>
                            
                            <div class="form-group">
                                <label for="trekName">Name of trek/activity applied for</label>
                                <input type="text" id="trekName" name="trekName" placeholder="e.g. Manali Trek" required>
                            </div>
                            <div class="form-group">
                                <label for="participantName">1. Name of Participant</label>
                                <input type="text" id="participantName" name="participantName" required>
                            </div>
                            <div class="form-group">
                                <label for="employeeName">2. Name of Employee</label>
                                <input type="text" id="employeeName" name="employeeName" required>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="relation">3. Relation with Rly. employee</label>
                                    <input type="text" id="relation" name="relation" required>
                                </div>
                                <div class="form-group">
                                    <label for="designation">4. Designation</label>
                                    <input type="text" id="designation" name="designation" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="officeAddress">5. Office address</label>
                                <input type="text" id="officeAddress" name="officeAddress">
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="dob">6. DOB (of participant)</label>
                                    <input type="text" id="dob" name="dob" placeholder="DD/MM/YYYY">
                                </div>
                                <div class="form-group">
                                    <label for="doa">4. DOA (of employee)</label>
                                    <input type="text" id="doa" name="doa" placeholder="DD/MM/YYYY">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="contact">7. Contact no(s)</label>
                                    <input type="text" id="contact" name="contact">
                                </div>
                                <div class="form-group">
                                    <label for="email">E-mail</label>
                                    <input type="email" id="email" name="email">
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="residentialAddress">8. Residential address</label>
                                <input type="text" id="residentialAddress" name="residentialAddress">
                            </div>
                            <div class="form-group">
                                <label for="experience">9. Experience in adventure (if any)</label>
                                <input type="text" id="experience" name="experience">
                            </div>
                        </div>

                        <div class="form-section">
                            <h3>Uploads</h3>
                            <div class="form-group">
                                <label for="photoUpload">Participant Photo (Passport Size)</label>
                                <input type="file" id="photoUpload" name="photoUpload" accept="image/*">
                            </div>
                        </div>

                        <div class="form-section">
                            <h3>Medical Certificate</h3>
                            <div class="form-group">
                                <label for="illness">1. Present/Past illness</label>
                                <input type="text" id="illness" name="illness" placeholder="None">
                            </div>
                            <div class="form-group">
                                <label for="injuries">2. Injuries/operation</label>
                                <input type="text" id="injuries" name="injuries" placeholder="None">
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="allergy">3. Known allergy</label>
                                    <input type="text" id="allergy" name="allergy" placeholder="None">
                                </div>
                                <div class="form-group">
                                    <label for="bloodGroup">4. Blood Group</label>
                                    <input type="text" id="bloodGroup" name="bloodGroup" placeholder="e.g. O+">
                                </div>
                            </div>
                            <p class="sub-label">5. Is the applicant suffering from:</p>
                            <div class="medical-grid">
                                <label>Infectious disease</label>
                                <select id="infectious"><option value="No">No</option><option value="Yes">Yes</option></select>
                                
                                <label>A skin disease</label>
                                <select id="skin"><option value="No">No</option><option value="Yes">Yes</option></select>
                                
                                <label>Heart trouble</label>
                                <select id="heart"><option value="No">No</option><option value="Yes">Yes</option></select>
                                
                                <label>Asthmatic</label>
                                <select id="asthmatic"><option value="No">No</option><option value="Yes">Yes</option></select>
                                
                                <label>Any other disease</label>
                                <select id="otherDisease"><option value="No">No</option><option value="Yes">Yes</option></select>
                            </div>
                        </div>

                        <button type="submit" class="btn primary-btn">Generate & Upload Form</button>
                        <p id="status-message" class="status"></p>
                    </form>
                </div>

                <!-- Preview Section -->
                <div class="panel preview-panel glass">
                    <div class="preview-header">
                        <h2>Live Preview</h2>
                        <button id="downloadBtn" class="btn secondary-btn" disabled>Download Image</button>
                    </div>
                    <div class="canvas-container">
                        <!-- Canvas dimension matches background image roughly -->
                        <canvas id="formCanvas" width="654" height="900"></canvas>
                    </div>
                </div>
            </div>
        </main>
        
        <footer>
            <p>Generated securely with HTML5 Canvas. Setup on Vercel & Supabase.</p>
        </footer>
    </div>
    
    <!-- Load background image silently so we can draw it on canvas -->
    <img id="bg-image" src="form-bg.jpg" alt="form background" style="display:none;">

    <script src="app.js"></script>
</body>
</html>
